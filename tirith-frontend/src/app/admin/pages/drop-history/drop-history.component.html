<h1>Drop History Inspector</h1>
<br>
<h3>Inspect the drop claims of members over time to detect suspicious patterns</h3>
<br>

<div class="flex flex-col w-full justify-center items-center">
  <div class="grid grid-cols-2 desktop:grid-cols-3 gap-4 w-fit items-center">
    <span class="col-span-2 desktop:col-span-1 justify-self-end">By Discord ID: </span>
    <input #id type="number" placeholder="1234567890123456">
    <input type="button" value="Add Member" (click)="addMemberDiscordId(id.value)">

    <span class="col-span-2 desktop:col-span-1 justify-self-end">By Typo ID: </span>
    <input #typoId type="number" placeholder="12345678">
    <input type="button" value="Add Member" (click)="addMemberLogin(+typoId.value)">
  </div>

  <br>

  <div class="grid grid-cols-4 gap-4 w-fit items-center">
    <span class="col-span-2 desktop:col-span-1 justify-self-end">Start date: </span>
    <input #start type="date" value="2020-01-01">

    <span class="col-span-2 desktop:col-span-1 justify-self-end">End date: </span>
    <input #end type="date" [valueAsDate]="now">
  </div>
</div>


<ng-container *ngIf="(history$ | async) as members">

  <br>
  <canvas baseChart
          class="bg-white rounded-md"
          [data]="members"
          [options]="scatterChartOptions"
          [type]="'scatter'">
  </canvas>

</ng-container>
